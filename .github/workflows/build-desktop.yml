name: Build RK Logistics desktop

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "release-trigger.json"

permissions:
  contents: write

concurrency:
  group: rk-logistics-public-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout release channel
        uses: actions/checkout@v4
        with:
          path: release-channel

      - name: Checkout private RK Logistics source
        uses: actions/checkout@v4
        with:
          repository: a89817778886-sudo/RK-logistics
          ref: main
          token: ${{ secrets.RK_SOURCE_TOKEN }}
          path: source-meta
          fetch-depth: 1

      - name: Read source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C source-meta rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide whether a scheduled build is needed
        id: decide
        shell: bash
        run: |
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          LAST_SHA=""
          if [ -f release-channel/last-source-sha.txt ]; then
            LAST_SHA="$(tr -d '\r\n ' < release-channel/last-source-sha.txt)"
          fi

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SOURCE_SHA" = "$LAST_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No source changes since the last successful desktop release."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building source commit $SOURCE_SHA"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private RK Logistics source
        uses: actions/checkout@v4
        with:
          repository: a89817778886-sudo/RK-logistics
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.RK_SOURCE_TOKEN }}
          fetch-depth: 1

      - name: Validate signing secrets
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$PUBLIC_KEY" || (echo "Missing TAURI_SIGNING_PUBLIC_KEY" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend tooling
        run: npm install

      - name: Prepare immutable version
        shell: bash
        env:
          RK_VERSION: 1.0.${{ github.run_number }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/prepare-release.mjs

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          owner: a89817778886-sudo
          repo: RK-logistics-releases
          releaseCommitish: main
          tagName: v__VERSION__
          releaseName: "RK Logistics v__VERSION__"
          releaseBody: "Автоматическая сборка RK Logistics. Исходный commit: ${{ needs.prepare.outputs.source_sha }}"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  mark-success:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release channel
        uses: actions/checkout@v4

      - name: Record released source commit
        shell: bash
        run: |
          printf "%s\n" "${{ needs.prepare.outputs.source_sha }}" > last-source-sha.txt
          git config user.name "RK Logistics Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add last-source-sha.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record released source ${{ needs.prepare.outputs.source_sha }}"
          git push
